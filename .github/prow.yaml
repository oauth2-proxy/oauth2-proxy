labels:
  area:
    - core
    - authentication
    - authorization
    - session
    - cookies
    - upstream
    - proxy
    - provider
    - configuration
    - api
    - documentation
    - ci
    - testing
    - docker
    - release
    - security
  kind:
    - bug
    - enhancement
    - documentation
    - refactor
    - test
    - breaking-change
  provider:
    - adfs
    - azure
    - bitbucket
    - cidaas
    - digitalocean
    - facebook
    - gitea
    - github
    - gitlab
    - google
    - keycloak
    - linkedin
    - logingov
    - ms-entra-id
    - nextcloud
    - oidc
    - srht

require_matching_label:
  - regexp: ^kind/
    missing_label: needs-kind
    issues: true
    prs: true
    missing_comment: "Please add a kind label with /kind <value>."

tide:
  merge_on_events: false
