# This configuration is intended to be used with the Traefik local environment.
# Dex uses in-memory storage because this environment is disposable.
issuer: http://dex.localtest.me/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
expiry:
  signingKeys: "4h"
  idTokens: "1h"
staticClients:
  - id: oauth2-proxy
    redirectURIs:
      - "http://oauth2-proxy.localtest.me/oauth2/callback"
    name: "OAuth2 Proxy"
    secret: b2F1dGgyLXByb3h5LWNsaWVudC1zZWNyZXQK
enablePasswordDB: true
staticPasswords:
  - email: "admin@example.com"
    # bcrypt hash of the string "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "admin"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
